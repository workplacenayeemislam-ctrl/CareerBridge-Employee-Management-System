<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerBridge Employee Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="container mx-auto px-4 py-12">
    <section class="glass-card mx-auto max-w-3xl rounded-3xl bg-white/10 p-10 shadow-2xl backdrop-blur-xl">
      <div class="mb-8 text-center">
        <h1 class="text-4xl font-semibold text-white">CareerBridge Employee Management</h1>
        <p class="mt-3 text-slate-300">Secure access for admins, HR staff, and operations team members.</p>
      </div>

      <form id="loginForm" class="space-y-6">
        <div>
          <label class="mb-2 block text-sm text-slate-200">Email</label>
          <input type="email" id="email" required class="input-field w-full" placeholder="name@company.com" />
        </div>
        <div>
          <label class="mb-2 block text-sm text-slate-200">Password</label>
          <input type="password" id="password" required class="input-field w-full" placeholder="Enter your password" />
        </div>
        <button type="submit" class="btn-primary w-full">Sign in</button>
      </form>

      <p class="mt-6 text-center text-slate-400">Use this page to access the admin dashboard and employee modules.</p>
    </section>
  </main>

  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
